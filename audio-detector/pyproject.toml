[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-detector"
version = "1.0.0"
description = "Configurable time-domain audio detection on a video-aligned frame grid"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["audio_detector"]
